<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dreamina Video Extractor</title><link rel="stylesheet" href="/styles.css"></head>
  <body>
    <main>
      <p class="eyebrow">DREAMINA SHARE LINKS</p>
      <h1>Get the video<br><em>without the watermark.</em></h1>
      <p class="intro">Paste a Dreamina share link. The download starts as soon as the clean video is found.</p>
      <form id="extract-form">
        <label for="share-url">Share link</label>
        <div class="input-row"><input id="share-url" type="url" required placeholder="https://dreamina.capcut.com/sv2/..." autocomplete="url"><button>Download</button></div>
      </form>
      <section id="result" aria-live="polite" hidden></section>
      <p class="fine-print">Only download videos you own or are authorized to save.</p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
